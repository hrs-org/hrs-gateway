name: Release UAT to AKS

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0, dev-abc123, or "latest")'
        required: true
        default: "latest"
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - staging

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-hrsm-uat
  AKS_CLUSTER_NAME: hrsm-uat-aks
  NAMESPACE: uat
  DEPLOYMENT_NAME: hrs-gateway-uat
  SERVICE_NAME: hrs-gateway-uat-svc

jobs:
  deploy-to-aks:
    name: Deploy to AKS ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate target environment
        run: |
          if [ "${{ github.event.inputs.environment }}" != "uat" ]; then
            echo "This workflow only deploys the UAT manifest and UAT AKS resources."
            exit 1
          fi

      - name: Set up Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Label namespace for Istio sidecar injection
        run: |
          kubectl label namespace ${{ env.NAMESPACE }} istio-injection=enabled --overwrite

      - name: Ensure cert-manager is installed
        run: |
          if kubectl api-resources | grep -q '^certificates[[:space:]]'; then
            echo "cert-manager CRDs already present."
          else
            echo "Installing cert-manager CRDs and controllers..."
            kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
          fi

          kubectl -n cert-manager wait --for=condition=Available --timeout=300s deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector

      - name: Configure TLS ingress resources
        run: |
          kubectl apply -f k8s/clussterissuer-uat.yaml
          kubectl apply -f k8s/ingress-uat.yaml
          kubectl delete ingress hrs-gateway-ingress -n ${{ env.NAMESPACE }} --ignore-not-found

      - name: Attach ACR to AKS (if not already attached)
        run: |
          az aks update \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --attach-acr ${{ secrets.ACR_NAME }} || echo "ACR already attached or unable to attach"

      - name: Verify image exists in ACR
        run: |
          echo "🔍 Verifying image exists in ACR..."

          # List all available tags
          echo "Available tags:"
          az acr repository show-tags \
            --name ${{ secrets.ACR_NAME }} \
            --repository hrs-gateway-uat \
            --orderby time_desc \
            --output table

          # Check if specific tag exists
          if az acr repository show-tags \
              --name ${{ secrets.ACR_NAME }} \
              --repository hrs-gateway-uat \
              --output tsv | grep -q "^${{ github.event.inputs.version }}$"; then
            echo "✅ Image tag '${{ github.event.inputs.version }}' found in ACR"
          else
            echo "❌ Image tag '${{ github.event.inputs.version }}' not found in ACR"
            echo ""
            echo "Please use one of the available tags listed above or build the image first."
            exit 1
          fi

      - name: Install Trivy
        run: |
          echo "📦 Installing Trivy..."
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Image Scan
        run: |
          echo "🔍 Running Trivy security scan on image..."

          # Login to ACR to pull image
          az acr login --name ${{ secrets.ACR_NAME }}

          IMAGE_URL="${{ secrets.ACR_NAME }}.azurecr.io/hrs-gateway-uat:${{ github.event.inputs.version }}"
          echo "Scanning image: $IMAGE_URL"

          # Run Trivy scan with JSON output
          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-results.json \
            "$IMAGE_URL"

          # Run Trivy scan with table output for logs
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            "$IMAGE_URL"

          # Check for CRITICAL vulnerabilities
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

          echo ""
          echo "📊 Scan Summary:"
          echo "  - CRITICAL: $CRITICAL_COUNT"
          echo "  - HIGH: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ Found $CRITICAL_COUNT CRITICAL vulnerability(ies) in the image"
            echo "🚫 Blocking deployment due to CRITICAL vulnerabilities"
            exit 1
          else
            echo ""
            echo "✅ No CRITICAL vulnerabilities found"
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "⚠️  Warning: $HIGH_COUNT HIGH severity vulnerabilities found (not blocking)"
            fi
          fi

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-scan-results
          path: trivy-results.json
          retention-days: 30

      - name: Prepare deployment manifest
        run: |
          echo "Preparing deployment manifest with secrets..."

          # Replace placeholders in the deployment file
          sed "s|__ACR_NAME__|${{ secrets.ACR_NAME }}|g" k8s/deployment-uat.yaml | \
          sed "s|__IMAGE_TAG__|${{ github.event.inputs.version }}|g" | \
          sed "s|__AUTH0_DOMAIN__|${{ secrets.AUTH0_DOMAIN }}|g" | \
          sed "s|__AUTH0_AUDIENCE__|${{ secrets.AUTH0_AUDIENCE }}|g" | \
          sed "s|__CORS_ORIGIN_0__|${{ secrets.CORS_ORIGIN_LOCALHOST || 'http://localhost:4200' }}|g" | \
          sed "s|__CORS_ORIGIN_1__|${{ secrets.CORS_ORIGIN_UAT || 'https://hrs-frontend-uat.azurewebsites.net' }}|g" \
          > k8s/deployment-final.yaml

          # Show the final manifest for debugging (mask sensitive values)
          echo "=== Final Deployment Manifest (sensitive values masked) ==="
          cat k8s/deployment-final.yaml | grep -v -E "(AUTH0_DOMAIN|CORS_ORIGIN)" || cat k8s/deployment-final.yaml

      - name: Deploy to AKS
        run: |
          echo "🚀 Deploying to AKS..."
          kubectl apply -f k8s/deployment-final.yaml

          # Annotate deployment with metadata
          kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            deployment.kubernetes.io/version="${{ github.event.inputs.version }}" \
            deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
            deployment.kubernetes.io/deployed-at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --overwrite

      - name: Wait for deployment rollout
        run: |
          echo "⏳ Waiting for deployment to complete..."
          TIMEOUT_SECONDS=600
          POLL_INTERVAL=15
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do
            if kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
              --namespace=${{ env.NAMESPACE }} \
              --timeout=${POLL_INTERVAL}s; then
              echo "✅ Deployment rollout completed successfully"
              exit 0
            fi

            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            echo "Still waiting... ${ELAPSED}s/${TIMEOUT_SECONDS}s"

            echo "Current deployment status:"
            kubectl get deployment/${{ env.DEPLOYMENT_NAME }} \
              --namespace=${{ env.NAMESPACE }} \
              -o wide || true

            echo "Current pod status:"
            kubectl get pods -n ${{ env.NAMESPACE }} -l app=hrs-gateway -o wide || true
          done

          echo "❌ Deployment rollout timed out after ${TIMEOUT_SECONDS}s"
          echo "Collecting diagnostics..."

          kubectl describe deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }} || true

          echo "Recent namespace events:"
          kubectl get events \
            --namespace=${{ env.NAMESPACE }} \
            --sort-by=.metadata.creationTimestamp | tail -n 40 || true

          exit 1

      - name: Force restart deployment
        run: |
          echo "🔄 Forcing deployment restart for clean startup..."
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

      - name: Wait for restart to complete
        run: |
          echo "⏳ Waiting for restart to complete..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed. Verifying status..."
          echo ""

          echo "📦 Deployment status:"
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o wide
          echo ""

          echo "🔄 Pod status:"
          kubectl get pods -l app=hrs-gateway -n ${{ env.NAMESPACE }} -o wide
          echo ""

          echo "🌐 Service status:"
          kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }}
          echo ""

          echo "🔗 Ingress status (TLS ingress):"
          kubectl get ingress hrs-ingress-uat -n ${{ env.NAMESPACE }} || echo "TLS ingress not found"
          echo ""

          echo "📜 Deployment history:"
          kubectl rollout history deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."

          # Get the service endpoint
          SERVICE_IP=$(kubectl get service ${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
          echo "Service IP: $SERVICE_IP"

          # Port forward for testing (runs in background)
          kubectl port-forward service/${{ env.SERVICE_NAME }} 8080:80 -n ${{ env.NAMESPACE }} &
          PORT_FORWARD_PID=$!

          # Wait for port forward to be ready
          echo "Waiting for port forward to be ready..."
          sleep 10

          # Test health endpoint
          echo "Testing health endpoint..."
          if curl -f -s http://localhost:8080/health; then
            echo ""
            echo "✅ Health check passed"
            HEALTH_STATUS="success"
          else
            echo ""
            echo "❌ Health check failed"
            HEALTH_STATUS="failed"
          fi

          # Clean up port forward
          kill $PORT_FORWARD_PID || true

          # Exit with error if health check failed
          if [ "$HEALTH_STATUS" = "failed" ]; then
            exit 1
          fi

      - name: Post deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed at** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Status: Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Status: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi

  rollback:
    name: Rollback if needed
    runs-on: ubuntu-latest
    needs: deploy-to-aks
    if: failure()
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Set up Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Rollback deployment
        run: |
          echo "Rolling back deployment..."
          kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

          echo "Rollback completed. Current deployment status:"
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

  Availability-Tests:
    name: Availability Tests
    runs-on: ubuntu-latest
    needs: deploy-to-aks
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Run gateway availability tests
        env:
          BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
          FRONTEND_ORIGIN: ${{ secrets.CORS_ORIGIN_UAT }}
        run: |
          set -euo pipefail

          BASE_URL="${BASE_URL%/}"
          FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"

          echo "Testing gateway endpoint: $BASE_URL"

          echo "Checking gateway liveness"
          curl -sSf "$BASE_URL/health" >/dev/null

          echo "Checking gateway readiness"
          curl -sSf "$BASE_URL/health/ready" >/dev/null

          echo "Checking reverse-proxy route to email service"
          curl -sSf "$BASE_URL/health/email" >/dev/null

          echo "Gateway availability tests passed"

      - name: Post availability summary
        if: always()
        env:
          GATEWAY_ENDPOINT: ${{ secrets.UAT_API_ENDPOINT }}
          FRONTEND_ORIGIN: ${{ secrets.CORS_ORIGIN_UAT  }}
        run: |
          echo "## 🧪 Gateway Availability Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gateway Endpoint** | \`${GATEWAY_ENDPOINT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Origin** | \`${FRONTEND_ORIGIN}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Status: Availability Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Status: Availability Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi

  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: deploy-to-aks
    environment: ${{ github.event.inputs.environment }}
    env:
      DAST_HOST_PORT: "5000"
      DAST_CONTAINER_PORT: "8080"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Azure
        uses: azure/login@92a5484dfaf04ca78a945966f6f5fe3f403e099b
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull and run Docker image
        env:
          IMAGE_TAG: ${{ github.event.inputs.version }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"

          echo "Image tag from release input: ${IMAGE_TAG}"

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: IMAGE_TAG is empty!"
            echo "Using 'latest' as fallback"
            IMAGE_TAG="latest"
          fi

          echo "Pulling image: ${ACR_NAME}.azurecr.io/hrs-gateway-uat:${IMAGE_TAG}"
          docker pull "${ACR_NAME}.azurecr.io/hrs-gateway-uat:${IMAGE_TAG}"

          echo "Starting container..."
          docker run -d -p ${DAST_HOST_PORT}:${DAST_CONTAINER_PORT} --name hrs-gateway \
            -e Auth0__Domain="$AUTH0_DOMAIN" \
            -e Auth0__Audience="$AUTH0_AUDIENCE" \
            "${ACR_NAME}.azurecr.io/hrs-gateway-uat:${IMAGE_TAG}"

          echo "Waiting for application to start..."
          sleep 20

          echo "Container status:"
          docker ps -a

          echo "Container logs:"
          docker logs hrs-gateway

          echo "Testing health endpoint:"
          curl -f http://localhost:${DAST_HOST_PORT}/health || echo "Health endpoint not available"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@99b9334bed0a0ff8d797764e76c9ecae53168436 # v0.10.0
        with:
          target: "http://localhost:${{ env.DAST_HOST_PORT }}"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -l WARN -T 10 -I -config globalexcludeurl.url_list.url(0)=https://firefox-settings-attachments.cdn.mozilla.net.*"

      - name: Upload DAST scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-scan-results
          path: |
            report_html.html
            report_json.json
            report_md.md
            report_xml.xml
          retention-days: 7

      - name: Cleanup DAST container
        if: always()
        run: docker rm -f hrs-gateway || true

      - name: Post DAST summary
        if: always()
        run: |
          echo "## 🛡️ DAST Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scanned Image Tag** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scanner** | OWASP ZAP Baseline |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Status: DAST Scan Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Status: DAST Scan Failed" >> $GITHUB_STEP_SUMMARY
          fi
