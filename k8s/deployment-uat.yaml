apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrs-gateway-uat
  namespace: gateway
  labels:
    app: hrs-gateway
    environment: uat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hrs-gateway
  template:
    metadata:
      labels:
        app: hrs-gateway
        environment: uat
    spec:
      containers:
        - name: hrs-gateway
          image: __ACR_NAME__.azurecr.io/hrs-gateway-uat:__IMAGE_TAG__
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Jwt__Key
              value: "__JWT_KEY__"
            - name: Jwt__Issuer
              value: "__JWT_ISSUER__"
            - name: Cors__AllowedOrigins__0
              value: "__CORS_ORIGIN_0__"
            - name: Cors__AllowedOrigins__1
              value: "__CORS_ORIGIN_1__"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hrs-gateway-uat-svc
  namespace: gateway
  labels:
    app: hrs-gateway
    environment: uat
spec:
  selector:
    app: hrs-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrs-gateway-ingress
  namespace: gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hrs-gateway-uat-svc
                port:
                  number: 80
